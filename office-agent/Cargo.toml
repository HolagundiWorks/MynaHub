[package]
name = "office-agent"
version = "0.1.0"
description = "A governed tool registry over the office records, and an MCP server so an AI assistant can use them"
authors = ["Human Centric Works"]
license = "AGPL-3.0-only"
edition = "2024"

[lib]
name = "office_agent"

[[bin]]
name = "office-mcp"
path = "src/main.rs"

[dependencies]
office-core = { path = "../office-core" }
serde = "1"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

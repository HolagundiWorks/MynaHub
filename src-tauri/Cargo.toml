[package]
name = "architect-office-desktop"
version = "0.1.0"
description = "O-Studio company-file engine (cdylib for WinUI)"
authors = ["Human Centric Works"]
license = "AGPL-3.0-only"
edition = "2024"

[lib]
name = "architect_office_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
office-core = { path = "../office-core" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
fs4 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
printpdf = { version = "0.12", features = ["html", "png", "jpeg"] }
base64 = "0.22"
csv = "1"
qrcode = { version = "0.14", default-features = false }
png = "0.17"
harper-core = { version = "=2.13.0", features = ["concurrent"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

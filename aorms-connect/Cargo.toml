[package]
name = "aorms-connect"
version = "0.1.0"
description = "Sign in to AORMS with the suite's shared login and pull project details, for the office app"
authors = ["Human Centric Works"]
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [office-core, office-ffi, office-agent, src-tauri]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Test ${{ matrix.crate }}
        run: cargo test --manifest-path ${{ matrix.crate }}/Cargo.toml

  windows-app:
    # Public shared design library (assembly O.Ui), checked out beside this repo as MynaUI.
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
        with:
          path: aos
      - uses: actions/checkout@v4
        with:
          repository: HolagundiWorks/O-UI
          path: MynaUI
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the engine
        working-directory: aos
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Build the company-file engine (office.dll)
        working-directory: aos
        run: cargo build --release --manifest-path office-ffi/Cargo.toml
      - name: Build O-Studio
        working-directory: aos
        run: >
          dotnet build native/Adms.Desktop/Adms.Desktop.csproj -c Release
          -p:Platform=x64 -p:WindowsPackageType=None -p:EngineProfile=release
      - name: Test Osas.Core (company, users, assistant, monitor)
        working-directory: aos
        env:
          OFFICE_DLL_DIR: ${{ github.workspace }}/aos/office-ffi/target/release
        run: dotnet test native/Osas.Core.Tests/Osas.Core.Tests.csproj

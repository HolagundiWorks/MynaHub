[package]
name = "office-core"
version = "0.1.0"
description = "Office Core: the shared company file and records used by the architecture office apps"
authors = ["Human Centric Works"]
license = "AGPL-3.0-only"
edition = "2024"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
fs4 = "0.6"
